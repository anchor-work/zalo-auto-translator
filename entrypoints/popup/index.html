<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zalo 번역기 설정</title>
  </head>
  <body>
    <main>
      <h1>Zalo 번역기</h1>
      <p class="description">한국어를 베트남어로 번역하고 전송 전에 확인합니다.</p>

      <label class="toggle">
        <input id="enabled" type="checkbox" />
        <span>확장프로그램 사용</span>
      </label>

      <label>
        기본 말투
        <select id="tone">
          <option value="natural">자연스럽게</option>
          <option value="polite">정중하게</option>
          <option value="friendly">친근하게</option>
          <option value="coworker">동료에게</option>
          <option value="customer">고객에게</option>
          <option value="elder">연장자에게</option>
        </select>
      </label>

      <label id="mode-label" hidden>
        번역 모드
        <select id="mode">
          <option value="demo">데모 번역기</option>
          <option value="local-api">Gemini 번역 API</option>
        </select>
      </label>

      <label id="api-url-label" hidden>
        번역 API 주소
        <input id="api-url" type="url" spellcheck="false" />
      </label>

      <div id="developer-hint" class="hint" hidden>
        데모 예시: “안녕하세요”, “지금 어디에 있어요?”, “오늘 시간 괜찮아요?”
      </div>

      <div id="service-hint" class="hint service-hint">
        Gemini 번역 서버에 안전하게 연결됩니다. API 키는 확장프로그램에 저장되지 않습니다.
      </div>

      <section class="usage" aria-labelledby="usage-title">
        <h2 id="usage-title">오늘 사용량</h2>
        <dl>
          <div><dt>번역</dt><dd id="translations">0회</dd></div>
          <div><dt>원문</dt><dd id="characters">0자</dd></div>
          <div><dt>오류</dt><dd id="errors">0회</dd></div>
        </dl>
      </section>

      <button id="save" type="button">설정 저장</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
