<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zalo Translator</title>
  </head>
  <body>
    <main>
      <h1 id="app-name">Zalo Translator</h1>
      <p id="description" class="description"></p>

      <section id="onboarding" class="onboarding" hidden>
        <div class="welcome-mark" aria-hidden="true">文A</div>
        <h2 id="welcome-title"></h2>
        <p id="welcome-description" class="description"></p>
        <label><span id="onboarding-language-label"></span><select id="onboarding-language"></select></label>
        <label><span id="onboarding-target-label"></span><select id="onboarding-target"></select></label>
        <button id="start" type="button"></button>
      </section>

      <section id="settings" class="settings" hidden>
        <label class="toggle"><input id="enabled" type="checkbox" /><span id="enabled-label"></span></label>
        <label><span id="user-language-label"></span><select id="user-language"></select></label>
        <label><span id="target-language-label"></span><select id="target-language"></select></label>
        <div id="language-hint" class="hint"></div>
        <section class="usage" aria-labelledby="usage-title">
          <h2 id="usage-title"></h2>
          <dl>
            <div><dt id="translations-label"></dt><dd id="translations">0</dd></div>
            <div><dt id="characters-label"></dt><dd id="characters">0</dd></div>
            <div><dt id="errors-label"></dt><dd id="errors">0</dd></div>
          </dl>
        </section>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
