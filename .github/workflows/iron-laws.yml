name: Iron Laws

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Iron Laws
        run: pip install "git+https://github.com/JinHo-von-Choi/iron-laws.git@2b98ecd687ed1e2aaedc13ff243f9a9a401fa4fa"
      - name: Create SARIF report
        run: iron-laws audit . --format sarif -o iron-laws.sarif --limit 0 || true
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: iron-laws.sarif
      - name: Enforce high-risk findings
        run: iron-laws check . --fail-on HIGH

