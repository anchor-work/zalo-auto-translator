name: Deploy billing sandbox API to Cloud Run

on:
  workflow_dispatch:

concurrency:
  group: cloud-run-sandbox
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0890959839
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: zalo-translator-api-sandbox
  ARTIFACT_REPOSITORY: zalo-translator

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and push sandbox image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
      - name: Deploy sandbox service
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --service-account="zalo-translator-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets="ZALO_GEMINI_API_KEY=ZALO_GEMINI_API_KEY:latest,POLAR_ACCESS_TOKEN=POLAR_SANDBOX_ACCESS_TOKEN:latest,POLAR_WEBHOOK_SECRET=POLAR_SANDBOX_WEBHOOK_SECRET:latest" \
            --set-env-vars="ZALO_GEMINI_MODEL=gemini-3.1-flash-lite,ZALO_GEMINI_FALLBACK_MODEL=gemini-3.5-flash-lite,ZALO_REQUIRE_AUTH=false,ZALO_FIRESTORE_DATABASE_ID=default,POLAR_PRODUCT_ID=aad20da1-ebcc-47db-b0e7-5e087467aaa4,POLAR_ENVIRONMENT=sandbox" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=20 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=60 \
            --port=8080 \
            --quiet
      - name: Show sandbox service URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format="value(status.url)"
